name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows runner 是英文系统，控制台默认 cp1252；不设这两项，
    # 任何打印中文的脚本都会 UnicodeEncodeError（本地中文 Windows 发现不了）。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 项目零依赖，不需要 pip install
      - name: 端到端自检
        run: python tools/selftest.py

      - name: 元件逐字节
        run: python tools/verify_samples.py

      - name: 并联结构
        run: python tools/verify_parallel.py

      - name: 注释编码
        run: python tools/verify_comments.py

      - name: 地址权限 / 同址驱动
        run: python tools/verify_address.py --samples samples

      # 比较块两个槽位角色固定：A=常数、B=寄存器。写反不报错，但编辑器里变成
      # 「#83 == R0」恒假条件（现场核对过）。这里盯住映射、拒绝和往返类型。
      - name: 比较块槽位
        run: python tools/verify_compare.py

      # 手动抄地址表会抄错（已经错过一次：把合并单元格解成残行，误判 R256~R511 为保留区）。
      # 这里核对 R 区段自洽、地址库同址异义；仓库不带 skill/ 与 CHM，那两项会自动跳过。
      - name: 地址三方核对
        run: python tools/verify_addr_conflicts.py

      - name: 全量往返（仓库自带样本）
        run: python tools/roundtrip_full.py

      - name: 单文件版自检
        run: python syntec-ladder-mcp-standalone.py --selftest

      - name: MCP 端到端（起进程走 JSON-RPC）
        run: python tools/e2e_mcp.py

      # 技能包目前不随仓库发布；本机开发环境才有 skill/ 目录。
      # 有就跑一遍，没有就跳过（CI 里跑的是 clone 出来的仓库）。
      - name: 技能包独立可用（若有）
        shell: bash
        run: |
          if [ -d skill/syntec-plc ]; then
            python skill/syntec-plc/scripts/check_lad.py samples/B_branch.lad
            python skill/syntec-plc/assets/build_program.py
            python skill/syntec-plc/scripts/check_lad.py demo.lad
          else
            echo "skill/ 不存在，跳过"
          fi
